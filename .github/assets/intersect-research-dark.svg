<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 212" width="880" height="212" role="img" aria-label="Business-process digitisation, databases, distributed systems and financial correctness converging on one focus.">
  <style>
    .ink { fill: #FFFFFF; } .rule { stroke: #FFFFFF; }
    .accentf { fill: #22D3EE; } .accent { stroke: #22D3EE; }
    .lbl { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
           font-size: 17px; font-weight: 500; fill-opacity: .92; }
    .wire { stroke-opacity: .15; stroke-width: 1.2; }
    .spine{ stroke-opacity: .13; stroke-width: 1; }
    .node { stroke-opacity: .45; stroke-width: 1.5; }
    .core { stroke-opacity: .30; stroke-width: 1.4; }

    .flow { stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5 345;
            animation: flow 3.2s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 350; } to { stroke-dashoffset: 0; } }

    .halo { animation: halo 3.2s ease-out infinite; }
    @keyframes halo {
      0%   { r: 30; stroke-opacity: .55; }
      70%  { r: 44; stroke-opacity: 0; }
      100% { r: 44; stroke-opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; stroke-dasharray: none; stroke-opacity: .5; }
      .halo { animation: none; stroke-opacity: 0; }
    }
  </style>

  <line class="rule spine" x1="430" y1="28" x2="430" y2="178"/>

  <path class="rule wire" fill="none" d="M438,40  C560,40  620,110 768,110"/>
  <path class="rule wire" fill="none" d="M438,82  C560,82  620,110 768,110"/>
  <path class="rule wire" fill="none" d="M438,124 C560,124 620,110 768,110"/>
  <path class="rule wire" fill="none" d="M438,166 C560,166 620,110 768,110"/>

  <path class="accent flow" fill="none" d="M438,40  C560,40  620,110 768,110" style="animation-delay:0s"/>
  <path class="accent flow" fill="none" d="M438,82  C560,82  620,110 768,110" style="animation-delay:.8s"/>
  <path class="accent flow" fill="none" d="M438,124 C560,124 620,110 768,110" style="animation-delay:1.6s"/>
  <path class="accent flow" fill="none" d="M438,166 C560,166 620,110 768,110" style="animation-delay:2.4s"/>

  <text class="ink lbl" x="0" y="46">business-process digitisation</text>
  <text class="ink lbl" x="0" y="88">databases</text>
  <text class="ink lbl" x="0" y="130">distributed systems</text>
  <text class="ink lbl" x="0" y="172">financial correctness</text>

  <circle class="accent node" fill="none" cx="430" cy="40"  r="3.4"/>
  <circle class="accent node" fill="none" cx="430" cy="82"  r="3.4"/>
  <circle class="accent node" fill="none" cx="430" cy="124" r="3.4"/>
  <circle class="accent node" fill="none" cx="430" cy="166" r="3.4"/>

  <circle class="accent halo" fill="none" cx="800" cy="110" r="30"/>
  <circle class="rule core" fill="none" cx="800" cy="110" r="30"/>
  <circle class="accentf" cx="800" cy="110" r="5"/>
</svg>
